user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Configuración de logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main buffer=16k;

    # Optimización de rendimiento
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 20M;

    # Configuración SSL mejorada
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_ecdh_curve X25519:secp384r1;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Configuración de caché optimizada
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=CACHE:32m inactive=1w use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;

    # Configuración de buffers optimizados
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 16 32k;
    proxy_busy_buffers_size 64k;
    proxy_temp_file_write_size 64k;

    # Configuración de compresión
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Redirección HTTP → HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name web-app-fineract-fiter.duckdns.org;
        
        # Mejor manejo de Let's Encrypt
        location ^~ /.well-known/acme-challenge/ {
            allow all;
            root /var/www/certbot;
        }
        
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Servidor HTTPS
    server {
        listen [::]:443 ssl http2 reuseport;
        listen 443 ssl http2 reuseport;
        server_name web-app-fineract-fiter.duckdns.org;

        # Certificados SSL
        ssl_certificate /etc/letsencrypt/live/web-app-fineract-fiter.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/web-app-fineract-fiter.duckdns.org/privkey.pem;

        # Cabeceras de seguridad mejoradas
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; form-action 'self';";
        add_header Permissions-Policy "geolocation=(), midi=(), camera=(), usb=(), magnetometer=(), gyroscope=(), fullscreen=(self), payment=()";

        # Configuración del root y errores
        root /usr/share/nginx/html;
        index index.html;
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        # Configuración para Fineract (backend)
        location /fineract-provider/ {
            proxy_pass https://127.0.0.1:8443;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_verify off; # Solo para desarrollo, en producción configurar correctamente
            
            proxy_connect_timeout 75s;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;
            proxy_cache_bypass $http_upgrade;
            
            proxy_cache CACHE;
            proxy_cache_valid 200 302 12h;
            proxy_cache_valid 404 1m;
            proxy_cache_methods GET HEAD;
            proxy_cache_min_uses 2;
        }

        # Configuración para el frontend
        location / {
            try_files $uri $uri/ /index.html;
            
            # Cabeceras específicas para el frontend
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires 0;
            
            # Configuración de caché para assets estáticos
            location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
                expires 1y;
                add_header Cache-Control "public, immutable, max-age=31536000";
                access_log off;
                log_not_found off;
            }
        }

        # Bloqueo de archivos sensibles
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # Deshabilitar logging para recursos estáticos
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Health check endpoint
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "Healthy\n";
        }
    }
}