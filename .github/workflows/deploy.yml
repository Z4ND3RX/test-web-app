name: Web App Deployment Pipeline

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}
  APP_NAME: webapp
  FRONTEND_PORT: 4200
  DOCKER_NETWORK: webapp-network

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build Web App
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ secrets.ECR_REPOSITORY }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          build-args: |
            NODE_ENV=production
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 host to known_hosts
        run: ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2 with SSL
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          DOMAIN: web-app-fineract-fiter.duckdns.org
          APP_NAME: webapp
          FRONTEND_PORT: 4200
          DOCKER_NETWORK: webapp-network
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          AWS_REGION="${AWS_REGION}" \
          ECR_REPOSITORY="${ECR_REPOSITORY}" \
          DOMAIN="${DOMAIN}" \
          APP_NAME="${APP_NAME}" \
          FRONTEND_PORT="${FRONTEND_PORT}" \
          DOCKER_NETWORK="${DOCKER_NETWORK}" \
          IMAGE_TAG="${IMAGE_TAG}" \
          'bash -s' << 'EOSSH'
            set -euxo pipefail
            required_vars=("AWS_REGION" "ECR_REPOSITORY" "DOMAIN" "APP_NAME" "FRONTEND_PORT" "DOCKER_NETWORK" "IMAGE_TAG")
            for var in "${required_vars[@]}"; do
              if [ -z "${!var}" ]; then
                echo "ERROR: Variable $var no está definida"
                exit 1
              fi
            done
            
            # Authenticate with ECR
            aws ecr get-login-password --region $AWS_REGION | \
              sudo docker login --username AWS --password-stdin $ECR_REPOSITORY
            
            # Create network if not exists
            sudo docker network inspect $DOCKER_NETWORK &>/dev/null || sudo docker network create $DOCKER_NETWORK
            
            # Stop and remove old container if exists
            sudo docker stop $APP_NAME || true
            sudo docker rm $APP_NAME || true
            
            # Pull new image with retry logic
            for i in {1..3}; do
              if sudo docker pull $ECR_REPOSITORY:$IMAGE_TAG; then
                break
              fi
              sleep 5
              echo "Retrying to pull image (attempt $i/3)..."
            done
            
            # Run new container with health check
            sudo docker run -d \
              --name $APP_NAME \
              --network $DOCKER_NETWORK \
              --restart unless-stopped \
              --health-cmd "curl -f http://localhost:$FRONTEND_PORT || exit 1" \
              --health-interval 30s \
              --health-timeout 10s \
              --health-retries 3 \
              -e NODE_ENV=production \
              -e FINERACT_API_URL=https://52.15.88.237:8443 \
              -e FINERACT_API_URLS=https://52.15.88.237:8443 \
              -e FINERACT_PLATFORM_TENANT_IDENTIFIER=default \
              -p $FRONTEND_PORT:80 \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              -v webapp-data:/usr/share/nginx/html \
              $ECR_REPOSITORY:$IMAGE_TAG
            
            # Clean up old images (keep last 3)
            sudo docker image prune -af --filter "until=48h"
            sudo docker images | grep $ECR_REPOSITORY | tail -n +4 | awk '{print $3}' | xargs -r sudo docker rmi -f || true
            
            # Verify deployment
            echo "Waiting for container to start..."
            sleep 10
            sudo docker ps -a
            sudo docker inspect --format '{{json .State.Health }}' $APP_NAME
            sudo docker logs --tail 50 $APP_NAME
            
            # Update Nginx and SSL certificates
            if [ -f /etc/nginx/sites-available/$APP_NAME ]; then
              sudo certbot renew --quiet --no-self-upgrade
              sudo nginx -t && sudo systemctl reload nginx
            else
              echo "Nginx configuration not found, skipping reload"
            fi
            
            echo "Deployment completed successfully"
          EOSSH